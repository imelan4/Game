<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CODE: LIFE | شفرة حياة</title>
<style>
:root{--bg:#111318;--cr:#8F1D2C;--red:#F05260;--off:#F4F3F0;--gray:#858B96;--pn:#1a1d25;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--off);font-family:'Segoe UI','Noto Sans Arabic',Tahoma,Arial,sans-serif;line-height:1.7;
background-image:linear-gradient(rgba(240,82,96,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(240,82,96,.05) 1px,transparent 1px);background-size:36px 36px}
body:before{content:"01 10 11 00 01 10 11 00 10 01 11 00 01 10 11 00 10 01 11 00 01 10 11 00 10 01 11 00 01 10 11 00";position:fixed;inset:0;color:rgba(133,139,150,.07);font:14px monospace;word-break:break-all;line-height:2.2;pointer-events:none;direction:ltr;overflow:hidden}
#app{position:relative;max-width:760px;margin:0 auto;padding:16px}
.panel{background:var(--pn);border:1px solid rgba(240,82,96,.3);border-radius:14px;padding:20px;margin:14px 0;animation:in .4s ease;box-shadow:0 0 30px rgba(143,29,44,.15)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:.3em 0}
.center{text-align:center}
.ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
.logo{font:800 clamp(2.4rem,10vw,4rem)/1 'Segoe UI',monospace;letter-spacing:.08em;direction:ltr;text-shadow:0 0 24px var(--red)}
.logo span{color:var(--red)}
.ar-title{font-size:clamp(1.8rem,7vw,2.8rem);color:var(--red);font-weight:700}
.tag{color:var(--gray);font-size:1.15rem}
.drop{position:relative;width:90px;height:90px;margin:30px auto 20px}
.drop i{position:absolute;inset:14px 14px 4px;background:radial-gradient(circle at 35% 35%,var(--red),var(--cr));border-radius:50% 0 50% 50%;transform:rotate(-45deg);box-shadow:0 0 30px var(--red),0 0 60px rgba(240,82,96,.4);animation:pulse 2s infinite}
.drop:before,.drop:after{content:"";position:absolute;top:50%;height:2px;width:70px;background:linear-gradient(90deg,var(--red),transparent)}
.drop:before{right:100%}.drop:after{left:100%;transform:scaleX(-1)}
@keyframes pulse{50%{box-shadow:0 0 50px var(--red),0 0 90px rgba(240,82,96,.6)}}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--red);background:transparent;color:var(--off);padding:10px 20px;transition:.2s}
button:hover:not(:disabled){background:rgba(240,82,96,.18)}
button:focus-visible,input:focus-visible{outline:3px solid var(--off);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:linear-gradient(135deg,var(--cr),var(--red));border:0;font-weight:700;font-size:1.15rem;padding:14px 38px;box-shadow:0 0 22px rgba(240,82,96,.45)}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.95rem;color:var(--gray)}
.hud b{color:var(--off);font-size:1.1rem}
.bar{height:8px;background:#242831;border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cr),var(--red));box-shadow:0 0 10px var(--red);transition:width .6s}
.keys{display:flex;gap:8px;justify-content:center;align-items:center;direction:ltr;margin:10px 0}
.k{width:46px;height:46px;border:2px dashed var(--gray);border-radius:10px;display:grid;place-items:center;font:700 1.4rem monospace;color:var(--gray)}
.k.on{border:2px solid var(--red);color:var(--off);background:rgba(240,82,96,.15);box-shadow:0 0 16px var(--red);animation:pop .5s}
@keyframes pop{from{transform:scale(.4)}60%{transform:scale(1.2)}}
.nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.nav button{padding:4px 12px;font-size:.85rem;color:var(--gray);border-color:#3a3f4b}
.nav button[aria-current=true]{color:var(--off);border-color:var(--red);background:rgba(240,82,96,.2)}
.opt{display:block;width:100%;text-align:start;margin:8px 0;padding:12px 16px;border-color:#3a3f4b;background:#14161c}
.opt.sel{border-color:var(--red);background:rgba(240,82,96,.18)}
.opt.ok{border-color:#5fd38d;background:rgba(95,211,141,.14)}
.opt.bad{border-color:var(--red);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
pre,.cipher{direction:ltr;text-align:left;background:#0b0d11;border:1px solid #2b303b;border-radius:10px;padding:14px;overflow-x:auto;font:1rem/1.6 Consolas,monospace;margin:10px 0}
.cipher{text-align:center;font-size:clamp(2rem,10vw,3rem);letter-spacing:.3em;color:var(--red);text-shadow:0 0 16px var(--red)}
.tw{overflow-x:auto}
table{border-collapse:collapse;direction:ltr;width:100%;font-family:Consolas,monospace}
th,td{border:1px solid #333845;padding:8px 12px;text-align:center}
th{background:var(--cr)}
.fb{padding:10px 14px;border-radius:10px;margin:10px 0}
.fb.g{background:rgba(95,211,141,.12);border:1px solid #5fd38d}
.fb.r{background:rgba(240,82,96,.12);border:1px solid var(--red)}
.fb.h{background:rgba(133,139,150,.15);border:1px solid var(--gray)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
input[type=text]{font:700 1.6rem monospace;letter-spacing:.3em;text-align:center;direction:ltr;width:100%;padding:12px;background:#0b0d11;color:var(--off);border:2px solid var(--red);border-radius:10px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:#14161c;border:1px solid #2b303b;border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--red)}
.card{white-space:pre-wrap;background:#0b0d11;border:1px solid var(--red);border-radius:10px;padding:14px;text-align:start;font-family:inherit}
.big{font:800 clamp(1.6rem,8vw,2.6rem) monospace;color:var(--red);text-shadow:0 0 20px var(--red);direction:ltr}
small,.note{color:var(--gray)}
body{background-image:radial-gradient(ellipse at 50% -10%,rgba(143,29,44,.4),transparent 60%),linear-gradient(rgba(240,82,96,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(240,82,96,.045) 1px,transparent 1px);background-size:auto,36px 36px,36px 36px;background-attachment:fixed}
body:after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);pointer-events:none}
.panel{position:relative;background:linear-gradient(160deg,rgba(28,31,40,.94),rgba(17,19,24,.94));border:1px solid rgba(240,82,96,.28);border-radius:16px;padding:24px}
.panel:before,.panel:after{content:"";position:absolute;width:20px;height:20px;border:0 solid var(--red);pointer-events:none}
.panel:before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-top-left-radius:16px}
.panel:after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-bottom-right-radius:16px}
.brand{display:flex;justify-content:space-between;direction:ltr;font:600 .72rem monospace;letter-spacing:.18em;color:var(--gray);border-bottom:1px solid #2b303b;padding:6px 2px;margin-bottom:10px}
.live{color:var(--red);animation:blink 1.6s infinite}@keyframes blink{50%{opacity:.3}}
.badge{display:inline-block;font:700 .75rem monospace;letter-spacing:.18em;color:var(--red);border:1px solid var(--red);border-radius:6px;padding:2px 10px;direction:ltr;background:rgba(240,82,96,.08)}
.hud{background:#14161c;border:1px solid #2b303b;border-radius:12px;padding:10px 14px}
.opt{display:flex;align-items:center;gap:14px;border-radius:12px;padding:14px 16px}
.opt b{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--gray);display:grid;place-items:center;font:700 .9rem monospace;color:var(--gray);transition:.2s}
.opt:hover:not(:disabled) b,.opt.sel b{border-color:var(--red);color:var(--off);background:var(--cr)}
.opt.ok b{background:#2f8f5b;border-color:#5fd38d;color:#fff}
.k{background:#14161c;transition:.4s}
.k.on{background:linear-gradient(145deg,var(--cr),#4a0f18)}
.mark{display:block;width:min(300px,80%);margin:10px auto 16px;overflow:visible}
.mark .t{stroke-dasharray:6 8;animation:flow 3s linear infinite}@keyframes flow{to{stroke-dashoffset:-56}}
.primary{border-radius:12px;letter-spacing:.02em}
.primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 36px rgba(240,82,96,.7)}
.ring{width:150px;height:150px;border-radius:50%;margin:14px auto;display:grid;place-items:center;background:conic-gradient(var(--red) calc(var(--p)*1%),#242831 0);box-shadow:0 0 30px rgba(240,82,96,.3)}
.ring>div{width:122px;height:122px;border-radius:50%;background:#111318;display:grid;place-content:center;text-align:center;line-height:1.2}
.ring b{font:800 2.1rem monospace}
.card{background:linear-gradient(145deg,#1a0b0f,#0b0d11);line-height:1.9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const $=s=>document.querySelector(s);
const ST=[
{t:'اختراق الشفرة',key:'C',
 intro:'يستخدم النظام <b>شفرة قيصر (Caesar cipher)</b> بإزاحة مقدارها 3. رسالة الدخول المشفرة:',
 vis:'<div class="cipher" aria-label="EORRG">EORRG</div>',
 q:'ما الكلمة الأصلية؟',opts:['BLOOD','LIFE','HELP','DATA'],c:0,ltr:1,
 ex:'يجب إرجاع كل حرف مشفر <b>3 مواضع للخلف</b> في الأبجدية الإنجليزية: E→B ، O→L ، R→O ، R→O ، G→D، فتصبح الكلمة <b>BLOOD</b>.',
 h:['شفرة قيصر تُزيح كل حرف عددًا ثابتًا من المواضع. لفك التشفير اعكس الاتجاه.','ارجع 3 خطوات للخلف من كل حرف. مثال: الحرف E يعود إلى B.']},
{t:'تحليل الخوارزمية',key:'O',
 intro:'حلّل الشيفرة التالية بلغة Python:',
 vis:'<pre>for i in range(n):\n    for j in range(n):\n        process(i, j)</pre>',
 q:'ما التعقيد الزمني التقاربي (Asymptotic Time Complexity)؟',opts:['O(n)','O(n log n)','O(n²)','O(2ⁿ)'],c:2,ltr:1,
 ex:'الحلقة الداخلية تُنفَّذ <b>n</b> مرة مقابل كل تكرار للحلقة الخارجية، فيكون العدد الكلي n × n = <b>O(n²)</b>.',
 h:['عدّ كم مرة يُستدعى process بدلالة n.','الحلقتان متداخلتان وليستا متتاليتين، فالتكرارات تُضرب ولا تُجمع.']},
{t:'قاعدة بيانات الحياة',key:'D',
 intro:'<b>تنبيه:</b> الجدول التالي مجموعة بيانات تدريبية خيالية وليست معلومات طبية حقيقية. شرط 56 يوم تمرين برمجي فقط وليس قاعدة أهلية طبية.',
 vis:'<div class="tw"><table><tr><th>donor_id</th><th>eligible</th><th>last_donation_days</th></tr><tr><td>101</td><td>TRUE</td><td>70</td></tr><tr><td>102</td><td>TRUE</td><td>40</td></tr><tr><td>103</td><td>FALSE</td><td>100</td></tr><tr><td>104</td><td>TRUE</td><td>90</td></tr></table></div>',
 q:'اختر استعلام SQL الذي يعيد السجلات التي تحقق الشرطين معًا: eligible = TRUE و last_donation_days >= 56',
 opts:['SELECT * FROM Donors WHERE eligible = TRUE AND last_donation_days >= 56;','SELECT * FROM Donors WHERE eligible = TRUE OR last_donation_days >= 56;','SELECT donor_id FROM Donors WHERE last_donation_days <= 56;','SELECT * FROM Donors ORDER BY last_donation_days;'],c:0,ltr:1,lt:'ABCD',
 ex:'<b>AND</b> يتطلب تحقق الشرطين معًا فيعيد السجلين 101 و 104. أما <b>OR</b> فيكفيه تحقق شرط واحد فيُدخل سجلات لا تحقق الآخر (مثل 102 و 103). الخياران C و D لا يطبقان الشرطين.',
 h:['المطلوب تحقق الشرطين في آن واحد.','أي عامل منطقي يتطلب صحة الطرفين معًا؟ وانتبه لاتجاه المقارنة (>= أم <=).']},
{t:'حماية النظام',key:'E',
 intro:'موظف في مركز تبرع بالدم خيالي يتلقى بريدًا إلكترونيًا عاجلًا يطلب منه تسجيل الدخول عبر رابط غير مألوف لتحديث سجلات النظام.',
 vis:'',q:'ما الإجراء الأكثر أمانًا؟',
 opts:['فتح الرابط لفحصه.','إعادة توجيه البريد إلى الجميع.','تجنب الرابط، والتحقق من الطلب عبر قناة رسمية، والإبلاغ عن البريد المشبوه.','تنزيل المرفق على جهاز شخصي.'],c:2,lt:'ABCD',
 ex:'هذا <b>تصيّد احتيالي (Phishing)</b>: رسالة تستعجلك لدفعك إلى رابط مزيف. الحل الآمن: لا تضغط، تحقق عبر جهة اتصال رسمية معروفة، وأبلغ فريق الأمن. فتح الرابط أو نشره أو تنزيل المرفق قد ينقل الخطر للآخرين.',
 h:['الرسائل العاجلة مع روابط غير مألوفة علامة تحذير كلاسيكية.','الحل الصحيح يجمع ثلاث خطوات: تجنب، تحقق، أبلغ.']}
];
const FIN={t:'استعادة النظام',h:['المفاتيح الأربعة تُكوّن كلمة إنجليزية من أربعة أحرف.','اقرأ المفاتيح بالترتيب من اليسار إلى اليمين.']};
const LOGO='<svg class="mark" viewBox="0 0 240 110" aria-hidden="true"><defs><radialGradient id="g" cx=".35" cy=".35"><stop offset="0" stop-color="#F05260"/><stop offset="1" stop-color="#8F1D2C"/></radialGradient></defs><g fill="none" stroke="#F05260" stroke-width="1.5"><path class="t" d="M95 60H50V30H10"/><path class="t" d="M95 72H40V92H10"/><path class="t" d="M145 60H190V30H230"/><path class="t" d="M145 72H200V92H230"/></g><g fill="#F05260"><circle cx="10" cy="30" r="4"/><circle cx="10" cy="92" r="4"/><circle cx="230" cy="30" r="4"/><circle cx="230" cy="92" r="4"/></g><path d="M120 8C120 8 90 48 90 70a30 30 0 0 0 60 0C150 48 120 8 120 8z" fill="url(#g)" style="filter:drop-shadow(0 0 12px #F05260)"/><path d="M108 62h24M120 62v22M111 76h18" stroke="#F4F3F0" stroke-width="2" opacity=".85"/></svg>';
let S;
function init(){const pn=S&&S.name;S={name:pn||'',scr:'intro',view:0,prog:0,hints:[0,0,0,0,0],sel:null,fb:null,t0:0,end:0,wrong:0}}
const nHints=()=>S.hints.reduce((a,b)=>a+b,0);
const score=()=>Math.max(0,S.prog*100-nHints()*10);
const secs=()=>Math.floor(((S.end||Date.now())-S.t0)/1000);
const fmt=()=>{const s=secs();return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
let tick;
function start(){const el=$('#nm'),n=(el.value||'').replace(/\|/g,' ').trim().slice(0,30);if(!n){el.focus();el.setAttribute('aria-invalid','true');return}S.name=n;S.scr='play';S.t0=Date.now();clearInterval(tick);tick=setInterval(()=>{const e=$('#tm');if(e)e.textContent=fmt()},1000);render()}
function hud(){
 const ks=ST.map((s,i)=>`<div class="k ${S.prog>i?'on':''}">${S.prog>i?s.key:'?'}</div>`).join('');
 const nav=[...ST,FIN].map((s,i)=>`<button ${i>S.prog?'disabled':''} ${i===S.view?'aria-current="true"':''} onclick="go(${i})">${i<4?(i+1):'النهائي'}</button>`).join('');
 return `<div class="brand"><span>CODE:LIFE // MISSION CONTROL</span><span class="live">● LIVE</span></div><header class="hud"><div>النقاط <b id="sc">${score()}</b> / 500</div><div>الوقت <b id="tm">${fmt()}</b></div><div>التلميحات <b>${nHints()}</b></div></header>
 <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${S.prog}" aria-label="التقدم"><i style="width:${S.prog*20}%"></i></div>
 <div class="keys" aria-label="مفاتيح الوصول">${ks}</div><nav class="nav" aria-label="المراحل">${nav}</nav>`}
function go(i){if(i<=S.prog){S.view=i;S.sel=null;S.fb=null;render()}}
function pick(i){S.sel=i;S.fb=null;render();const b=document.querySelectorAll('.opt')[i];if(b)b.focus()}
function hint(){const v=S.view,arr=v<4?ST[v].h:FIN.h;if(S.hints[v]<arr.length&&S.prog<=v){S.hints[v]++;render()}}
function submit(){
 const v=S.view,s=ST[v];if(S.sel===null||S.prog>v)return;
 if(S.sel===s.c){S.prog=Math.max(S.prog,v+1);S.fb='ok'}else{S.fb='no';S.wrong++;S.sel=null}
 render()}
function submitFinal(){
 const val=$('#fin').value.trim().toUpperCase();
 if(val==='CODE'){S.prog=5;S.end=Date.now();clearInterval(tick);S.scr='win'}else{S.fb='no';S.wrong++}
 render();if(S.fb==='no'){const e=$('#fin');if(e)e.focus()}}
function hintsBox(v){const arr=v<4?ST[v].h:FIN.h;let h='';for(let i=0;i<S.hints[v];i++)h+=`<div class="fb h"><b>تلميح ${i+1}:</b> ${arr[i]}</div>`;return h}
function hintBtn(v){const arr=v<4?ST[v].h:FIN.h;return `<button onclick="hint()" ${S.hints[v]>=arr.length?'disabled':''}>طلب تلميح (−10 نقاط)</button>`}
function stage(){
 const v=S.view;
 if(v===4){
  const done=S.prog>4;
  return hud()+`<section class="panel"><h2>التحدي النهائي: استعادة النظام</h2>
  <p>اجمع المفاتيح التي حصلت عليها بالترتيب وأدخل رمز الوصول النهائي:</p>
  <div class="big center">C — O — D — E</div>
  <label for="fin" class="note">رمز الوصول (لا يؤثر حجم الأحرف)</label>
  <input type="text" id="fin" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" onkeydown="if(event.key==='Enter')submitFinal()">
  ${S.fb==='no'?'<div class="fb r" role="alert">الرمز غير صحيح. راجع المفاتيح وأعد المحاولة.</div>':''}
  ${hintsBox(4)}<div class="row"><button class="primary" onclick="submitFinal()">فتح النظام</button>${hintBtn(4)}</div></section>`}
 const s=ST[v],solved=S.prog>v;
 const opts=s.opts.map((o,i)=>{
  let c='opt';if(solved&&i===s.c)c+=' ok';else if(!solved&&S.sel===i)c+=' sel';
  const lt=`<b class="ltr">${'ABCD'[i]}</b>`;
  return `<button class="${c}" ${solved?'disabled':''} aria-pressed="${S.sel===i}" onclick="pick(${i})">${lt}<span ${s.ltr?'class="ltr" dir="ltr"':''}>${esc(o)}</span></button>`}).join('');
 return hud()+`<section class="panel"><div class="badge">STAGE 0${v+1} / 04</div><h2>${s.t}</h2><p>${s.intro}</p>${s.vis}<h3>${s.q}</h3>${opts}
 ${S.fb==='no'&&!solved?'<div class="fb r" role="alert">إجابة غير صحيحة. حاول مرة أخرى، ولن تفقد أي نقاط بسبب المحاولة.</div>':''}
 ${solved?`<div class="fb g"><b>إجابة صحيحة!</b> حصلت على المفتاح <b class="ltr">${s.key}</b>.<br>${s.ex}</div>`:hintsBox(v)}
 <div class="row">${solved?`<button class="primary" onclick="go(${v+1})">${v<3?'التحدي التالي':'إلى التحدي النهائي'}</button>`:`<button class="primary" onclick="submit()" ${S.sel===null?'disabled':''}>تأكيد الإجابة</button>${hintBtn(v)}`}
 ${v>0?`<button onclick="go(${v-1})">السابق</button>`:''}</div></section>`}
function label(){const s=score();return s===500?'صانع الأثر':s>=400?'محلل شفرات':s>=250?'متدرب أمن رقمي':'مبتدئ الشفرة'}
function resText(){return `CODE: LIFE | شفرة حياة\nالنتيجة: ${score()} / 500\nالتحديات المحلولة: ${S.prog} / 5\nالتلميحات المستخدمة: ${nHints()}\nالوقت: ${fmt()}\nالتصنيف: ${label()}\nالاسم: ${S.name}\n${code()}`}
function win(){return `<section class="panel center">${LOGO}<div class="big">SYSTEM RESTORED</div><h2>تمت استعادة النظام بنجاح.</h2>
 <p class="tag">«كل شفرة لها حل، وكل قطرة قد تصنع فرقًا.»</p>
 <p>تساعد التقنية خدمات التبرع بالدم عبر إدارة البيانات بأمان وتنظيمها، أما التبرع بالدم نفسه فقد يساعد في إنقاذ الأرواح.</p>
 <div class="ring" style="--p:${score()/5}"><div><b>${score()}</b><small>من 500</small></div></div><h3>التصنيف: ${label()}</h3>
 <div class="stats"><div class="stat"><b>${score()}/500</b>النقاط</div><div class="stat"><b>${S.prog}/5</b>تحديات محلولة</div><div class="stat"><b>${nHints()}</b>تلميحات</div><div class="stat"><b>${fmt()}</b>الوقت</div></div>
 <div class="card" id="card" tabindex="0">${esc(resText())}</div>
 <div class="row" style="justify-content:center"><button class="primary" onclick="copyRes()">نسخ النتيجة</button><button onclick="init();render()">إعادة اللعب</button></div>
 <p id="cm" role="status" class="note"></p><p id="lb" role="status" class="note"></p>
 <p class="note">ملاحظة: اللعبة لا تحفظ النتائج ولا تنشئ لوحة متصدرين عامة. انسخ النتيجة وأرسلها في نموذج ينظمه المنظّمون؛ وعند التعادل في النقاط يُفضَّل الأقل وقتًا.</p></section>`}
async function copyRes(){
 const t=resText(),m=$('#cm');
 try{await navigator.clipboard.writeText(t);m.textContent='تم نسخ النتيجة.'}
 catch(e){const r=document.createRange();r.selectNodeContents($('#card'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
  try{document.execCommand('copy');m.textContent='تم نسخ النتيجة.'}catch(_){m.textContent='تعذّر النسخ تلقائيًا. تم تحديد النص، انسخه يدويًا.'}}}
function render(){
 const a=$('#app');
 if(S.scr==='intro')a.innerHTML=`<section class="panel center" style="margin-top:8vh">${LOGO}<div class="logo">CODE<span>:</span> LIFE</div><div class="ar-title">شفرة حياة</div><p class="tag">«فك الشفرة، واكتشف الأثر.»</p><p class="note" style="direction:ltr;letter-spacing:.2em;font:600 .8rem monospace">SECURE TERMINAL · 5 STAGES · 500 PTS</p><button class="primary" onclick="S.scr='brief';render()">ابدأ المهمة</button></section>`;
 else if(S.scr==='brief')a.innerHTML=`<section class="panel"><h2>إحاطة المهمة</h2>
 <p>أنت محلل جنائي رقمي مكلّف باستعادة النظام الرقمي لمركز تبرع بالدم <b>خيالي</b>. تعرّض النظام للقفل، ولن يُفتح إلا بجمع أربعة مفاتيح وصول من أربعة تحديات تقنية، ثم إدخال رمز الوصول النهائي.</p>
 <ul><li>اختر إجابتك ثم اضغط «تأكيد الإجابة». يمكنك إعادة المحاولة بلا عقوبة.</li><li>كل تحدٍّ بـ 100 نقطة تُمنح مرة واحدة، والحد الأقصى 500.</li><li>كل تلميح يخصم 10 نقاط، ولا تنزل النقاط تحت الصفر.</li><li>الوقت يُحتسب ويكسر التعادل. يمكنك مراجعة المراحل المحلولة دون فقدان التقدم.</li><li>لا حاجة لتسجيل الدخول ولا تُجمع بيانات شخصية.</li></ul>
 <label for="nm"><b>سجّل اسمك</b> <span class="note">(اسم أو لقب يظهر في لوحة المتصدرين، لا تُدخل بيانات حساسة)</span></label><input type="text" id="nm" maxlength="30" value="${esc(S.name)}" autocomplete="off" style="text-transform:none;letter-spacing:0;font-size:1.2rem;direction:auto;margin:8px 0 14px" onkeydown="if(event.key==='Enter')start()"><button class="primary" onclick="start()">ابدأ التحدي الأول</button></section>`;
 else if(S.scr==='play')a.innerHTML=stage();
 else if(S.scr==='lb')a.innerHTML=lbView();else{a.innerHTML=win();submitScore()}
 window.scrollTo(0,0);
}
const chk=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h.toString(36)};
const code=()=>{const b=`${S.name}|${score()}|${secs()}|${nHints()}`;return 'CODE-LIFE|'+b+'|'+chk(b)};
let DB=null,USR=null,BACK='intro',ROWS=[];
const READY=(async()=>{try{DB=await window.claude.use('db');USR=await window.claude.use('user')}catch(e){}})();
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
async function submitScore(){await READY;const m=$('#lb');if(!m)return;
 if(!DB||!USR){m.textContent='لم تُسجَّل نتيجتك تلقائيًا في هذا العرض. انسخ النتيجة وأرسلها للمنظّمين.';return}
 try{const id=await USR.id();if(!id)throw 0;const ref=DB.doc('scores/'+id),old=await ref.get(),o=old.exists?old.data():null,n={name:S.name,score:score(),secs:secs(),hints:nHints(),at:Date.now()};
  if(!o||n.score>o.score||(n.score===o.score&&n.secs<o.secs))await ref.set(n);
  m.textContent='تم تسجيل نتيجتك في لوحة المتصدرين (يُحتسب أفضل أداء لك).'}
 catch(e){m.textContent='تعذّر التسجيل المباشر (قد لا تملك صلاحية الكتابة). انسخ النتيجة وأرسلها للمنظّمين.'}}
async function openLB(){await READY;BACK=S.scr;S.scr='lb';render();loadLB()}
function lbView(){return `<section class="panel"><h2>لوحة المتصدرين</h2><div id="lbt">${DB?'جارٍ التحميل…':'اللوحة غير متاحة في هذا العرض. انسخ نتيجتك وأرسلها للمنظّمين.'}</div><div class="tw"><table id="lbtab"></table></div><div id="org"></div><div class="row"><button onclick="S.scr=BACK;render()">رجوع</button></div></section>`}
async function loadLB(){if(!DB)return;try{const s=await DB.collection('scores').get();ROWS=s.docs.map(d=>d.data());await drawLB()}catch(e){const t=$('#lbt');if(t)t.textContent='تعذّر تحميل اللوحة.'}}
async function drawLB(){const t=$('#lbtab');if(!t)return;ROWS.sort((a,b)=>b.score-a.score||a.secs-b.secs);
 $('#lbt').textContent=ROWS.length?'':'لا توجد نتائج بعد.';
 t.style.direction='rtl';t.innerHTML='<tr><th>#</th><th>الاسم</th><th>النقاط</th><th>الوقت</th><th>تلميحات</th></tr>'+ROWS.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.score}</td><td>${mmss(r.secs)}</td><td>${r.hints}</td></tr>`).join('');
 const o=$('#org');if(o&&USR&&await USR.isOwner())o.innerHTML='<h3>لوحة المنظّم</h3><p class="note">الصق أسطر النتائج (CODE-LIFE|...) سطرًا لكل لاعب لإضافتها للوحة.</p><textarea id="imp" rows="4" style="width:100%;direction:ltr;background:#0b0d11;color:#F4F3F0;border:1px solid #2b303b;border-radius:10px;padding:8px"></textarea><div class="row"><button onclick="impRows()">استيراد</button><button onclick="expCsv()">تصدير CSV</button></div><p id="om" class="note" role="status"></p>'}
async function impRows(){let ok=0,bad=0;for(const l of $('#imp').value.split('\n').map(s=>s.trim()).filter(Boolean)){const p=l.split('|');
  if(p.length===6&&p[0]==='CODE-LIFE'&&p[5]===chk(p.slice(1,5).join('|'))&&[2,3,4].every(i=>isFinite(+p[i])&&+p[i]>=0)&&+p[2]<=500){try{await DB.doc('scores/i'+chk(l)).set({name:p[1],score:+p[2],secs:+p[3],hints:+p[4],at:Date.now(),imported:true});ok++}catch(e){bad++}}else bad++}
 await loadLB();$('#om').textContent=`تم استيراد ${ok} وتم رفض ${bad}.`}
async function expCsv(){const q=n=>{n=String(n);if(/^[=+\-@]/.test(n))n="'"+n;return '"'+n.replace(/"/g,'""')+'"'};const d=await window.claude.use('downloads');if(!d)return;
 d.save({filename:'code-life-results.csv',data:'\ufeff#,name,score,secs,hints\n'+ROWS.map((r,i)=>[i+1,q(r.name),r.score,r.secs,r.hints].join(',')).join('\n')}).catch(()=>{})}
init();render();
</script>
</body>
</html>
